name: Generate Snake & Stats

on:
  schedule:
    - cron: "0 0 * * *" # 每天零点自动刷新
  workflow_dispatch: # 支持手动触发
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # vercel.app 域名在国内被 DNS 污染，这里在 Actions 服务器上抓取
      # 转存为静态 SVG，README 引用 output 分支的副本，国内访客也能正常加载
      - name: Snapshot stats cards & banner
        env:
          UA: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36
        run: |
          set -e
          fetch() {
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -A "$UA" "$2" -o "dist/$1"
            grep -q "<svg" "dist/$1" || { echo "::error::$1 is not a valid SVG"; exit 1; }
            echo "$1 ok ($(wc -c < dist/$1) bytes)"
          }
          fetch header.svg "https://capsule-render.vercel.app/api?type=waving&color=0:7aa2f7,100:bb9af7&height=190&section=header&text=Ring%20Zhang%20%C2%B7%20ZRZ&fontSize=44&fontColor=ffffff&animation=twinkling&desc=%F0%9F%8E%AE%20Game%20Dev%20%C3%97%20Code&descSize=16&descAlignY=68"
          fetch stats.svg "https://github-readme-stats.vercel.app/api?username=ZRZRING&show_icons=true&hide_border=true&count_private=true&include_all_commits=true&title_color=7aa2f7&text_color=c0caf5&icon_color=bb9af7&ring_color=7aa2f7&bg_color=1a1b26"
          fetch top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=ZRZRING&layout=compact&hide_border=true&langs_count=8&title_color=7aa2f7&text_color=c0caf5&bg_color=1a1b26"
          fetch trophy.svg "https://github-profile-trophy.vercel.app/?username=ZRZRING&theme=tokyonight&no-frame=true&no-bg=true&margin-w=6"
          fetch footer.svg "https://capsule-render.vercel.app/api?type=waving&color=0:bb9af7,100:7aa2f7&height=120&section=footer"

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
