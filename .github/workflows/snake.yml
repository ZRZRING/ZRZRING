name: Generate Snake & Stats

on:
  schedule:
    - cron: "0 0 * * *" # 每天零点自动刷新
  workflow_dispatch: # 支持手动触发
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # capsule-render 生成的横幅是静态快照即可；统计卡则完全自渲染（见 scripts/render_cards.py），
      # 因为 github-readme-stats 公共实例长期 503、github-profile-trophy 已 402 欠费下线，
      # 且 vercel.app 域名在国内被 DNS 污染 —— 转存/自渲染后 README 引用 output 分支副本，国内访客也能正常加载
      - name: Snapshot banner & footer
        env:
          UA: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36
        run: |
          set -e
          fetch() {
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -A "$UA" "$2" -o "dist/$1"
            grep -q "<svg" "dist/$1" || { echo "::error::$1 is not a valid SVG"; exit 1; }
            echo "$1 ok ($(wc -c < dist/$1) bytes)"
          }
          fetch header.svg "https://capsule-render.vercel.app/api?type=waving&color=0:7aa2f7,100:bb9af7&height=190&section=header&text=Ring%20Zhang%20%C2%B7%20ZRZ&fontSize=44&fontColor=ffffff&animation=twinkling&desc=%F0%9F%8E%AE%20Game%20Dev%20%C3%97%20Code&descSize=16&descAlignY=68"
          fetch footer.svg "https://capsule-render.vercel.app/api?type=waving&color=0:bb9af7,100:7aa2f7&height=120&section=footer"

      - name: Render stats cards from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARD_USER: ${{ github.repository_owner }}
        run: python3 scripts/render_cards.py dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
